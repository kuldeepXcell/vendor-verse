<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="title desc">
    <title id="title">Animated Nexus Mods logo</title>
    <desc id="desc">A smooth looping animation with a rotating logo, breathing background, orbiting highlights, and a
        soft shine.
    </desc>

    <defs>
        <radialGradient id="bgGradient" cx="36%" cy="28%" r="78%">
            <stop offset="0%" stop-color="#f6b15d"/>
            <stop offset="55%" stop-color="#da8e35"/>
            <stop offset="100%" stop-color="#ad6421"/>
        </radialGradient>

        <linearGradient id="shineGradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.48"/>
            <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>

        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#6f350f" flood-opacity="0.34"/>
        </filter>

        <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="10" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <clipPath id="circleClip">
            <circle cx="512" cy="512" r="512"/>
        </clipPath>
    </defs>

    <style>
        /*
        MASTER LOOP: 12 seconds

        12s logo rotation = 1 revolution
        6s primary orbit = 2 revolutions
        12s reverse orbit = 1 revolution
        6s background breathe = 2 cycles
        4s halo pulse = 3 cycles
        3s logo pulse = 4 cycles
        6s shine sweep = 2 cycles
        */

        .bg,
        .halo,
        .orbit,
        .logo-spin,
        .logo-pulse,
        .shine {
        transform-box: view-box;
        transform-origin: 512px 512px;
        }

        .bg {
        will-change: transform;
        }

        .halo {
        fill: none;
        stroke: #fff;
        opacity: 0;
        animation: haloPulse 4s ease-out infinite;
        will-change: transform, opacity;
        }

        /*
        Negative delays ensure all halos are already correctly phased
        when the SVG first appears.
        */
        .halo.delay-1 {
        animation-delay: -1.333333s;
        }

        .halo.delay-2 {
        animation-delay: -2.666667s;
        }

        .orbit {
        fill: none;
        stroke: #fff;
        stroke-linecap: round;
        animation: orbitSpin 6s linear infinite;
        will-change: transform;
        }

        .orbit.reverse {
        animation-direction: reverse;
        animation-duration: 12s;
        }

        .logo-spin {
        animation: logoSpin 12s linear infinite;
        will-change: transform;
        }

        .logo-pulse {
        animation: logoPulse 3s ease-in-out infinite;
        will-change: transform;
        }

        .logo-path {
        shape-rendering: geometricPrecision;
        }

        .shine {
        animation: shineSweep 6s ease-in-out infinite;
        will-change: transform, opacity;
        }

        @keyframes breathe {
        0%,
        100% {
        transform: scale(1);
        }

        50% {
        transform: scale(1.025);
        }
        }

        @keyframes haloPulse {
        0% {
        opacity: 0;
        transform: scale(0.78);
        stroke-width: 14;
        }

        22% {
        opacity: 0.2;
        }

        68% {
        opacity: 0;
        transform: scale(1.08);
        stroke-width: 2;
        }

        100% {
        opacity: 0;
        transform: scale(1.08);
        stroke-width: 2;
        }
        }

        @keyframes orbitSpin {
        from {
        transform: rotate(0deg);
        }

        to {
        transform: rotate(360deg);
        }
        }

        @keyframes logoSpin {
        from {
        transform: rotate(0deg);
        }

        to {
        transform: rotate(360deg);
        }
        }

        @keyframes logoPulse {
        0%,
        100% {
        transform: scale(1);
        }

        50% {
        transform: scale(1.035);
        }
        }

        @keyframes shineSweep {
        0%,
        12% {
        transform: translateX(-1200px) rotate(-18deg);
        opacity: 0;
        }

        26% {
        opacity: 0.55;
        }

        48% {
        transform: translateX(1200px) rotate(-18deg);
        opacity: 0;
        }

        100% {
        transform: translateX(1200px) rotate(-18deg);
        opacity: 0;
        }
        }

        @media (prefers-reduced-motion: reduce) {
        * {
        animation: none !important;
        }
        }
    </style>

    <g class="bg">
        <circle cx="512" cy="512" r="512" fill="url(#bgGradient)"/>
    </g>

    <g clip-path="url(#circleClip)" pointer-events="none">
        <circle class="halo" cx="512" cy="512" r="356"/>
        <circle class="halo delay-1" cx="512" cy="512" r="356"/>
        <circle class="halo delay-2" cx="512" cy="512" r="356"/>

        <circle class="orbit" cx="512" cy="512" r="430" stroke-width="5" stroke-dasharray="42 112" opacity="0.17"/>
        <circle class="orbit reverse" cx="512" cy="512" r="394" stroke-width="3" stroke-dasharray="16 74"
                opacity="0.13"/>

        <g class="logo-spin" filter="url(#softGlow)">
            <g class="logo-pulse">
                <path class="logo-path" fill="#fff"
