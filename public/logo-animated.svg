<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vendor Verse animated mark. Same geometry as logo.svg; the check draws in and
  the node breathes. Honours prefers-reduced-motion, matching the app's own
  reduced-motion rule in src/styles.css.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="vva-title vva-desc">
  <title id="vva-title">Vendor Verse</title>
  <desc id="vva-desc">The Vendor Verse check draws itself in and its node pulses gently.</desc>
  <defs>
    <linearGradient id="vva-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#283345"/>
      <stop offset="1" stop-color="#3c4a63"/>
    </linearGradient>
    <style>
      .vva-check {
        stroke-dasharray: 700;
        animation: vva-draw 3.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .vva-node { animation: vva-breathe 3.6s ease-in-out infinite; transform-origin: 758px 272px; }
      @keyframes vva-draw {
        0%   { stroke-dashoffset: 700; }
        35%  { stroke-dashoffset: 0; }
        88%  { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 700; }
      }
      @keyframes vva-breathe {
        0%, 30%  { opacity: 0; transform: scale(0.4); }
        45%      { opacity: 1; transform: scale(1.15); }
        60%, 88% { opacity: 1; transform: scale(1); }
        100%     { opacity: 0; transform: scale(0.4); }
      }
      @media (prefers-reduced-motion: reduce) {
        .vva-check { animation: none; stroke-dasharray: none; }
        .vva-node  { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#vva-tile)"/>
  <path class="vva-check" d="M300 344 L474 668 L688 358" fill="none" stroke="#f9fafb"
        stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="vva-node" cx="758" cy="272" r="70" fill="#7b8799"/>
</svg>
