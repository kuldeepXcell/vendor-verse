<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vendor Verse mark. Original artwork drawn for this template.
  Colours are the "Slate & Steel" tokens from src/styles.css, resolved to hex
  so the file rasterises in any tool:
    tile gradient  primary  oklch(0.32 0.035 260) = #283345  to  #3c4a63
    glyph          primary-foreground oklch(0.985 0.002 250) = #f9fafb
    node           accent   oklch(0.62 0.03 258)  = #7b8799
  One stroke reads as both the V of Vendor Verse and an approval check;
  the node on the rising arm is the vendor it resolves to.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="vv-title">
  <title id="vv-title">Vendor Verse</title>
  <defs>
    <linearGradient id="vv-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#283345"/>
      <stop offset="1" stop-color="#3c4a63"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#vv-tile)"/>
  <path d="M300 344 L474 668 L688 358" fill="none" stroke="#f9fafb" stroke-width="92"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="758" cy="272" r="70" fill="#7b8799"/>
</svg>
